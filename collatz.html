<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Collatz 數列核心分析儀</title>
<style>
    body {
        margin: 0;
        font-family: "Cascadia Code", "Consolas", monospace;
        background: #0f1117;
        color: #e6e6e6;
    }
    h1 {
        color: #f0f0f0;
        text-align: center;
        margin: 10px 0;
    }
    .container {
        display: grid;
        grid-template-columns: 550px 1fr;
        height: 100vh;
    }
    .left {
        padding: 16px;
        overflow-y: auto;
        border-right: 1px solid #222;
        background: #161922;
    }
    .right {
        padding: 16px;
        display: flex;
        flex-direction: column;
    }
    .controls {
        background: #1b1f2a;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 15px;
        position: sticky;
        top: 0;
    }
    input, button {
        background: #252a37;
        color: #e6e6e6;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 10px;
    }
    button {
        cursor: pointer;
        background: #3d5afe;
        border: none;
        font-weight: bold;
    }
    button:hover {
        background: #536dfe;
    }

    .asc {
        color: #ffb86c;
    }
    .desc {
        color: #7fd3ff;
    }
    .peak {
        color: #ff5555;
        font-weight: bold;
    }
    .valley {
        color: #80a0ff;
    }

    .seq-item {
        display: grid;
        grid-template-columns: 45px 120px 90px 100px 1fr;
        align-items: center;
        padding: 6px 8px;
        border-bottom: 1px solid #222;
        font-size: 13px;
    }
    .seq-item:hover {
        background: #252a37;
        border: 1px solid #888;
    }
    .col {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .val-text {
        text-align: right;
        padding-right: 12px;
    }
    
    canvas {
        background: #0f1117;
        border: 1px solid #222;
        flex-grow: 1;
        width: 100%;
        image-rendering: -webkit-optimize-contrast;
    }
</style>
</head>
<body>
<div class="container">
    <div class="left">
        <h1>Collatz 數列分析</h1>
        <div class="controls">
            起始值：
            <input id="start" type="number" value="7" placeholder="輸入正整數"/>
            <button onclick="run()">計算</button>
        </div>
        <div id="list"></div>
    </div>
    <div class="right">
        <canvas id="chart" width="1200" height="800"></canvas>
    </div>
</div>

<script>
function collatz(n) {
    return n % 2 === 0 ? n / 2 : 3 * n + 1;
}

function isLocalKernel2(seq, i) {
    if (seq[i] % 2 === 0)
        return false;
    if (i < 2)
        return true;
    if (seq[i - 2] > seq[i])
        return true;
    return false;
}

function isPrimitiveKernel2(seq, i) {
    if (!isLocalKernel2(seq, i))
        return false;
    let x = seq[i] + 1;
    return x % 3 !== 0;
}

function isPeak(seq, i) {
    if (seq[i] % 2 !== 0)
        return false;
    if (seq[i - 1] > seq[i])
        return false;
    if (i + 1 === seq.length)
        return true;
    if (seq[i + 1] % 2 === 0)
        return true;
    // peak / 2 = 3^k * n_odd - 1
    let next = seq[i] / 2;
    let x = next + 1;
    return x % 2 !== 0 && x % 3 === 0;
}

function isPostPeakKernel3(seq, i) {
    if (seq[i] % 2 !== 0)
        return false;
    if (i === 0) {
        // kernel3 := 3^k * n_odd - 1
        let x = seq[i] + 1;
        return x % 3 === 0;
    }
    return isPeak(seq, i - 1);
}

function parseKernel2(value) {
    // kernel2 := 2^k * n_odd - 1
    let x = value + 1;
    let k = 0;
    while (x % 2 === 0) {
        k++;
        x /= 2;
    }
    return [k, x];
}

function parseKernel3(value) {
    // kernel3 := 3^k * n_odd - 1
    let x = value + 1;
    let k = 0;
    while (x % 3 === 0) {
        k++;
        x /= 3;
    }
    return [k, x];
}

function run() {
    const startVal = parseInt(document.getElementById('start').value);
    if (isNaN(startVal) || startVal <= 0) {
        alert("請輸入正整數");
        document.getElementById('startVal').value = ""
        return;
    }
    let seq = [startVal];
    while (seq[seq.length - 1] !== 1) {
        seq.push(collatz(seq[seq.length - 1]));
    }
    let info = seq.map((v, i) => {
        let lk2 = isLocalKernel2(seq, i);
        let pk2 = isPrimitiveKernel2(seq, i);
        let ppk3 = isPostPeakKernel3(seq, i);
        let peak = isPeak(seq, i);
        
        let asc = false, desc = false;
        if (lk2) {
            asc = true;
        }
        else if (ppk3) {
            desc = true;
        }
        else if (i > 0) {
            asc = v > seq[i-1];
            desc = v < seq[i-1];
        }
        return { v, i, lk2, pk2, ppk3, peak, asc, desc };
    });
    renderList(seq, info);
    drawChart(seq, info);
}

function renderList(seq, info) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    info.forEach((item) => {
        let cls = item.peak ? 'peak' : item.lk2 ? 'valley' : item.asc ? 'asc' : item.desc ? 'desc' : '';
        let format = "";
        let tags = [];
        if (item.lk2) {
            let [k, odd] = parseKernel2(item.v);
            format = `2^${k} * ${odd} - 1`;
            tags.push('LK2');
            if (item.pk2)
                tags.push('PK2');
        } else if (item.ppk3) {
            let [k, odd] = parseKernel3(item.v);
            format = `3^${k} * ${odd} - 1`;
            tags.push('PPK3');
        }
        if (item.peak)
            tags.push('Crest');
        let seg = [];
        if (item.asc)
            seg.push('上升區段');
        if (item.desc)
            seg.push('下降區段');
        const div = document.createElement('div');
        div.className = `seq-item ${cls}`;
        div.innerHTML = `
            <div class="col">${item.i}</div>
            <div class="col" style="font-size:11px">${seg.join(',')}</div>
            <div class="col val-text">${item.v}</div>
            <div class="col" style="font-weight:bold">${tags.join(',')}</div>
            <div class="col" style="opacity:0.7">${format}</div>
        `;
        list.appendChild(div);
    });
}

function drawChart(seq, info) {
    const c = document.getElementById('chart');
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);

    const max = Math.max(...seq);
    const min = 1;
    const pad = 60;
    const getX = (i) => pad + i * (c.width - 2 * pad) / (seq.length - 1 || 1);
    const getY = (v) => c.height - pad - (v - min) * (c.height - 2 * pad) / (max - min || 1);
    ctx.strokeStyle = '#222';
    ctx.beginPath();
    for(let i=0; i<=10; i++) {
        let h = pad + i * (c.height - 2 * pad) / 10;
        ctx.moveTo(pad, h); ctx.lineTo(c.width - pad, h);
    }
    ctx.stroke();

    // lines
    ctx.beginPath();
    ctx.lineWidth = 2;
    seq.forEach((v, i) => {
        i === 0 ? ctx.moveTo(getX(i), getY(v)) : ctx.lineTo(getX(i), getY(v));
    });
    ctx.strokeStyle = '#555';
    ctx.stroke();

    // points
    info.forEach((item) => {
        ctx.beginPath();
        if (item.peak) {
            ctx.fillStyle = '#ff5555';
            ctx.arc(getX(item.i), getY(item.v), 6, 0, Math.PI * 2);
        } else if (item.lk2) {
            ctx.fillStyle = '#80a0ff';
            ctx.arc(getX(item.i), getY(item.v), 5, 0, Math.PI * 2);
        } else {
            ctx.fillStyle = item.asc ? '#ffb86c' : '#7fd3ff';
            ctx.arc(getX(item.i), getY(item.v), 3, 0, Math.PI * 2);
        }
        ctx.fill();
    });
}

run();
</script>
</body>
</html>
